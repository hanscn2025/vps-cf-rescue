name = "cf-sub"
main = "src/index.js"
compatibility_date = "2026-11-01"

# workers.dev 域名在国内基本打不开，用自己的子域名
# routes = [{ pattern = "sub.example.com", custom_domain = true }]

# 测速由 VPS 上的 cf-sub-optimize.py 定时完成，Worker 不需要定时任务
[triggers]
crons = []

[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_ID"

[vars]
HOST = "edge.example.com"
PORT = "443"

